apiVersion: apps/v1
kind: Deployment
metadata:
  name: gunxtech-ufin-omnichat-backoffice-client-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gunxtech-ufin-omnichat-backoffice-client
  template:
    metadata:
      labels:
        app: gunxtech-ufin-omnichat-backoffice-client
    spec:
      imagePullSecrets:
        - name: docker-registry-gunxtech
      containers:
        - name: gunxtech-ufin-omnichat-backoffice-client
          imagePullPolicy: IfNotPresent
          image: busybox
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gunxtech-ufin-omnichat-backoffice-client-service
spec:
  type: ClusterIP
  selector:
    app: gunxtech-ufin-omnichat-backoffice-client
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
